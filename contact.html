<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Digital Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            color: #333;
            background-color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0078d7;
            background: url('logo.png');
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            gap: 40px;
        }

        nav ul li {
            font-size: 1rem;
        }

        nav ul li a {
            text-decoration: none;
            color: #0078d7;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #6a11cb;
        }

        nav .cta {
            background-color: #0078d7;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        nav .cta:hover {
            background-color: #005bb5;
        }

        .contact-section {
            padding: 60px 40px;
            background: linear-gradient(to bottom right, #0078d7, #6a11cb);
            text-align: center;
        }

        .contact-section h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .contact-section p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #ffee00;
            max-width: 800px;
            margin: 0 auto 40px;
        }

        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #33ccff 0%, #ff99cc 100%);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .contact-form input,
        .contact-form textarea,
        .contact-form button {
            width: 95%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ffeded;
            border-radius: 5px;
            font-size: 1rem;
        }

        .contact-form button {
            background-color: #0078d7;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .contact-form button:hover {
            background-color: #f3a006;
        }

        footer {
            background-color: #1a1a2e;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        footer a {
            color: #ff4c29;
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .spark {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-style: oblique;
            font-display: flex;
            text-rendering: geometricPrecision;
            color: #0078d7;
            font-weight: bold;
            font-size: 24px;
        }
        .linked img {
            width: 35px;
            height: 35px;

        }
    </style>
</head>

<body>
    <nav>
        <div class="spark">Spark&copy</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="#" class="cta">Get Started</a>
    </nav>

    <div class="contact-section">
        <h1>Contact Us</h1>
        <p>Have questions or need help? Fill out the form below, and we’ll get back to you as soon as possible.</p>
        <div class="contact-form">
            <form action="#" method="post">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="linked">
            <a href="https://www.linkedin.com"><img src="https://img.icons8.com/?size=256&id=xuvGCOXi8Wyg&format=png"
                    alt="Linkedin Image"></a>
            <a href="https://www.x.com"><img src="https://img.icons8.com/?size=256&id=13963&format=png"
                    alt="Twitter Image"></a>
            <a href="https://www.facebook.com"><img src="https://img.icons8.com/?size=256&id=yGcWL8copNNQ&format=png"
                    alt="Facebook Image"></a>
        </div>
        <p>&copy; 2025 Digital Agency. All rights reserved. <a href="#">Privacy Policy</a> | <a href="#">Terms of
                Service</a></p>
    </footer>
</body>

</html>
